server {
    listen 80;
    server_name seat-booking.crownai.ink;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seat-booking.crownai.ink;

    ssl_certificate     /etc/letsencrypt/live/seat-booking.crownai.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seat-booking.crownai.ink/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    location /static/ {
        alias /root/seat-booking/seat_booking/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
